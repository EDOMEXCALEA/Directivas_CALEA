<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Directivas CALEA">
    <link rel="manifest" href="manifest.json">
    <title>Directivas CALEA | Estado de México</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        h1 small {
            font-size: 0.6rem;
            color: #666;
            display: block;
            margin-top: 5px;
        }
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .counter {
            text-align: center;
            margin: 10px 0;
            font-size: 0.9em;
            color: #666;
        }
        .chapter {
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        .chapter-header {
            background-color: #2c3e50;
            color: white;
            padding: 12px 15px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .chapter-header:hover {
            background-color: #1a2a3a;
        }
        .chapter-header .toggle-icon {
            font-size: 1.2em;
        }
        .chapter-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: white;
        }
        .chapter-content.open {
            max-height: 2000px;
            transition: max-height 0.5s ease-in;
        }
        .pdf-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .pdf-list li {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .pdf-list li:last-child {
            border-bottom: none;
        }
        .file-name {
            font-weight: 500;
            word-break: break-word;
            flex: 1;
            margin-right: 10px;
        }
        .actions a {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-left: 8px;
            display: inline-block;
        }
        .view {
            background-color: #0077cc;
            color: white;
        }
        .view:hover {
            background-color: #005fa3;
        }
        .download {
            background-color: #28a745;
            color: white;
        }
        .download:hover {
            background-color: #1e7e34;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #777;
            font-style: italic;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8em;
            color: #777;
        }
        @media (max-width: 600px) {
            .pdf-list li {
                flex-direction: column;
                align-items: flex-start;
            }
            .actions {
                margin-top: 8px;
            }
            .actions a {
                margin-left: 0;
                margin-right: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 Directivas CALEA<br><small>Estado de México</small></h1>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar por capítulo o nombre...">
    </div>
    <div class="counter" id="counter"></div>
    <div id="chaptersContainer"></div>
    <footer>Los archivos se abren en el navegador o se descargan. Haz clic en cada capítulo para desplegar.</footer>
</div>

<script>
    // Nombres de los capítulos (mapeo número -> nombre)
    const chapterNames = {
        "1": "Capítulo 1: Función y Autoridad de Aplicación de la Ley",
        "4": "Capítulo 4: Uso de la Fuerza",
        "11": "Capítulo 11: Organización y Administración",
        "12": "Capítulo 12: Dirección",
        "15": "Capítulo 15: Planeación y Estudios",
        "17": "Capítulo 17: Administración Contable y Bienes del Organismo",
        "21": "Capítulo 21: Clasificación y Definición de Deberes y Responsabilidades",
        "22": "Capítulo 22: Sistema de Administración de Personal",
        "26": "Capítulo 26: Procedimientos de Disciplina y Asuntos Internos",
        "31": "Capítulo 31: Reclutamiento y Selección",
        "33": "Capítulo 33: Capacitación y Desarrollo Profesional",
        "34": "Capítulo 34: Promoción",
        "35": "Capítulo 35: Evaluación del Desempeño",
        "40": "Capítulo 40: Análisis e Inteligencia Delictual",
        "41": "Capítulo 41: Patrulla",
        "42": "Capítulo 42: Investigación Penal",
        "43": "Capítulo 43: Control de Vicios, Drogas y Crimen Organizado",
        "46": "Capítulo 46: Incidentes Críticos, Operaciones Especiales y Seguridad Nacional",
        "54": "Capítulo 54: Información Pública",
        "61": "Capítulo 61: Tránsito",
        "70": "Capítulo 70: Traslado del Detenido",
        "74": "Capítulo 74: Notificación Judicial",
        "81": "Capítulo 81: Comunicaciones",
        "82": "Capítulo 82: Registros Centrales",
        "83": "Capítulo 83: Recolección y Preservación de Pruebas"
    };

    // Registrar service worker (si existe)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW no registrado:', err));
    }

    // Obtener y procesar los PDFs
    fetch('pdfs.json')
        .then(response => {
            if (!response.ok) throw new Error('No se pudo cargar pdfs.json');
            return response.json();
        })
        .then(pdfs => {
            // Agrupar por capítulo (primer número antes del primer "_")
            const chapters = {};
            pdfs.forEach(filename => {
                const match = filename.match(/^(\d+)_/);
                if (match) {
                    const chapter = match[1];
                    if (!chapters[chapter]) chapters[chapter] = [];
                    chapters[chapter].push(filename);
                } else {
                    // Archivos que no empiezan con número (ej: estandares_calea.pdf)
                    if (!chapters['Otros']) chapters['Otros'] = [];
                    chapters['Otros'].push(filename);
                }
            });

            // Ordenar capítulos numéricamente, y "Otros" al final
            const sortedChapters = Object.keys(chapters).sort((a, b) => {
                if (a === 'Otros') return 1;
                if (b === 'Otros') return -1;
                return parseInt(a) - parseInt(b);
            });

            // Guardar datos globalmente para búsqueda
            window.allPDFs = pdfs;
            window.chaptersData = chapters;
            window.sortedChapters = sortedChapters;

            renderChapters(chapters, sortedChapters);
            setupSearch(chapters, sortedChapters);
        })
        .catch(error => {
            console.error(error);
            document.getElementById('chaptersContainer').innerHTML = `<div class="no-results">⚠️ Error al cargar la lista de documentos. Verifica que el archivo pdfs.json esté en la raíz.</div>`;
        });

    function renderChapters(chapters, sortedChapters, filterTerm = '') {
        const container = document.getElementById('chaptersContainer');
        let totalDocs = 0;
        let html = '';

        sortedChapters.forEach(chapter => {
            let pdfs = chapters[chapter];
            // Aplicar filtro si existe
            if (filterTerm) {
                pdfs = pdfs.filter(filename => filename.toLowerCase().includes(filterTerm));
            }
            if (pdfs.length === 0) return; // omitir capítulos vacíos tras filtro
            totalDocs += pdfs.length;

            // Obtener nombre del capítulo
            let chapterDisplay;
            if (chapter === 'Otros') {
                chapterDisplay = '📁 Otros Documentos';
            } else if (chapterNames[chapter]) {
                chapterDisplay = `📁 ${chapterNames[chapter]}`;
            } else {
                chapterDisplay = `📁 Capítulo ${chapter}`;
            }

            const chapterId = `chapter-${chapter}`;
            html += `
                <div class="chapter">
                    <div class="chapter-header" onclick="toggleChapter('${chapterId}')">
                        <span>${chapterDisplay}</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div id="${chapterId}" class="chapter-content">
                        <ul class="pdf-list">
                            ${pdfs.map(filename => {
                                const safeName = encodeURIComponent(filename);
                                const viewUrl = `pdfs/${safeName}`;
                                const downloadUrl = `pdfs/${safeName}`;
                                return `
                                    <li>
                                        <span class="file-name">${escapeHtml(filename)}</span>
                                        <div class="actions">
                                            <a href="${viewUrl}" target="_blank" class="view">👁️ Ver</a>
                                            <a href="${downloadUrl}" download class="download">⬇️ Descargar</a>
                                        </div>
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </div>
                </div>
            `;
        });

        if (totalDocs === 0) {
            container.innerHTML = '<div class="no-results">No se encontraron documentos con ese criterio.</div>';
            document.getElementById('counter').textContent = `0 documento(s) encontrado(s)`;
            return;
        }

        container.innerHTML = html;
        document.getElementById('counter').textContent = `${totalDocs} documento(s) encontrado(s)`;
    }

    function toggleChapter(chapterId) {
        const content = document.getElementById(chapterId);
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            // Cambiar ícono
            const header = content.previousElementSibling;
            header.querySelector('.toggle-icon').textContent = '▼';
        } else {
            content.classList.add('open');
            const header = content.previousElementSibling;
            header.querySelector('.toggle-icon').textContent = '▲';
        }
    }

    function setupSearch(chapters, sortedChapters) {
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            // Crear una copia filtrada de los capítulos
            const filteredChapters = {};
            for (let [chapter, files] of Object.entries(chapters)) {
                const filteredFiles = files.filter(f => f.toLowerCase().includes(term));
                if (filteredFiles.length > 0) {
                    filteredChapters[chapter] = filteredFiles;
                }
            }
            // Reordenar capítulos (los mismos criterios)
            const filteredSorted = Object.keys(filteredChapters).sort((a, b) => {
                if (a === 'Otros') return 1;
                if (b === 'Otros') return -1;
                return parseInt(a) - parseInt(b);
            });
            renderChapters(filteredChapters, filteredSorted, term);
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
